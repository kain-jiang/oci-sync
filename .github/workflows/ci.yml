name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy, zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

  e2e:
    name: E2E against local registry
    runs-on: ubuntu-latest
    needs: check
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Wait for registry
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/v2/ && break || sleep 1
          done
          curl -sf http://localhost:5000/v2/

      - name: Run e2e smoke tests
        run: ./scripts/e2e.sh
        env:
          OCI_SYNC_TEST_REPO: localhost:5000/oci-sync-e2e/ci
          OCI_SYNC_BIN: ${{ github.workspace }}/target/release/oci-sync
